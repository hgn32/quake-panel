services:
  quake-panel:
    build: .
    image: quake-panel:latest
    container_name: quake-panel
    restart: unless-stopped
    # リバースプロキシ (nginx) の後ろに置く前提。直接公開しない (§2)。
    ports:
      - '127.0.0.1:8080:8080'
    # 設定はすべて既定で動く。変えたいときだけ environment に足す (README の表)。
    # 画像はメモリ上のリングバッファに置くだけなので、上限を切っておく
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
