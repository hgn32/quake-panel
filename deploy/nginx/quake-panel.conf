# 地震速報パネル用リバースプロキシ設定 (nginx)
#
# 利用条件上の要点 (検討書 §2):
#   - 強震モニタのコンテンツは複製・再配布が禁止されている。本システムは
#     「自宅 LAN + 本人の会社 PC」からの私的利用に閉じることが成立条件。
#     そのため Basic 認証を必須にし、不特定多数からアクセスできる状態にしない。
#   - クレジット表示はアプリ側 (画面左下) で行っている。
#
# 認証ファイルの作り方:
#   htpasswd -c /etc/nginx/quake-panel.htpasswd <ユーザー名>
#   chown root:www-data /etc/nginx/quake-panel.htpasswd && chmod 640 ...

upstream quake_panel {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name quake.example.lan;

    ssl_certificate     /etc/letsencrypt/live/quake.example.lan/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quake.example.lan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 検索エンジンに拾わせない
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;

    # --- 入場制限 (§2(1) の成立条件) ---
    auth_basic "quake-panel";
    auth_basic_user_file /etc/nginx/quake-panel.htpasswd;

    # 自宅 LAN からは認証を省略したい場合は satisfy any にして allow を並べる。
    # 会社 PC からのアクセスは固定 IP でない限り認証で通すこと。
    #   satisfy any;
    #   allow 192.168.0.0/24;
    #   deny  all;

    client_max_body_size 1m;

    location / {
        proxy_pass http://quake_panel;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- WebSocket ---
    # Upgrade / Connection は hop-by-hop ヘッダなので既定では転送されない。
    # 明示しないと接続が確立しない (§4)。
    location /ws {
        proxy_pass http://quake_panel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # 既定の 60 秒では、劣化モード中の無通信で切られてしまう。
        # アプリ側にも 30 秒間隔の ping/pong を入れてあるが、両方で担保する。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # 毎秒更新の最新フレームはキャッシュさせない
    location = /kmoni/latest.gif {
        proxy_pass http://quake_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
    }

    # 監視用。認証を外しておくと外形監視から叩ける。
    location = /healthz {
        auth_basic off;
        proxy_pass http://quake_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name quake.example.lan;
    return 301 https://$host$request_uri;
}
